# relay 自定义服务器 nginx 配置（HTTP 版 —— IP 直连，无 TLS）
# 适用: 手机端 relay 地址填 http://121.196.197.87（走 80 端口）
#
# 用法（root 在服务器上执行）:
#   1) 确认 relay 已跑:   systemctl status relay   （监听 127.0.0.1:8443）
#   2) 安装本配置:
#        install -m 644 deploy/nginx-http.conf /etc/nginx/conf.d/relay-ip.conf
#        # 如果 /etc/nginx/conf.d/ 里已有 relay-deepvisus-top.conf（域名版），先删掉避免 server 冲突:
#        rm -f /etc/nginx/conf.d/relay-deepvisus-top.conf
#   3) 验证并重载:
#        nginx -t && systemctl reload nginx
#   4) 本机验证:   curl http://121.196.197.87/relay/healthz   →  ok
#
# 后端: relay 监听 127.0.0.1:8443（见 deploy/relay.service；端口可改，但
#       要同步改这里的 proxy_pass）。

server {
    listen 80;
    listen [::]:80;
    server_name 121.196.197.87;

    # relay API + WebSocket（/relay/v1/host、/relay/v1/device 是 ws 升级端点）
    # 手机 App 常驻 WSS/WS 长连接，必须保留 Upgrade/Connection 头并关缓冲。
    location /relay/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接保活：1 天空闲不断开
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 健康检查与其他路径
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
