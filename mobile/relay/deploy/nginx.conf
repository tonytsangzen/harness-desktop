# relay.deepvisus.top — DeepSeek Harness 中继服务器 nginx 反向代理
# 提供 HTTPS + WSS（WebSocket 加密长连接），后端是 Go relay。
#
# 用法（Ubuntu/Debian）:
#   1) 安装:  apt install nginx certbot python3-certbot-nginx
#   2) 按 deploy/relay.service 装好 relay（默认监听 127.0.0.1:8443）
#   3) 把本文件放到:  /etc/nginx/conf.d/relay-deepvisus-top.conf
#   4) 申请证书(自动改写本文件填入证书路径):
#        certbot --nginx -d relay.deepvisus.top
#   5) 验证并重载:
#        nginx -t && systemctl reload nginx
#
# 443 (TLS/WSS) -> 127.0.0.1:8443 (relay HTTP)。
# 若改了 relay 端口（relay.service 的 RELAY_ADDR/-addr），同步改下方 proxy_pass。
#
# 验证:  curl https://relay.deepvisus.top/relay/healthz  →  ok

# ---------- HTTP -> HTTPS 重定向 ----------
server {
    listen 80;
    listen [::]:80;
    server_name relay.deepvisus.top;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS / WSS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.deepvisus.top;

    # Let's Encrypt 证书（certbot --nginx 会自动填入/续期）
    ssl_certificate     /etc/letsencrypt/live/relay.deepvisus.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.deepvisus.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RelaySSL:10m;
    ssl_session_timeout 1d;

    # relay API + WebSocket（/relay/v1/host、/relay/v1/device 是 ws 升级端点）
    # 手机端 WSS 长连接走这里，必须保留 Upgrade/Connection 头并关掉缓冲。
    location /relay/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接保活：手机 App 常驻连接，1 天空闲不断开
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 健康检查与其他路径
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
