name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Resolve version
        id: version
        run: |
          # Prefer the tag ref (e.g. refs/tags/v1.0.1 -> 1.0.1); fall back to
          # a run number for manual dispatch.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build app bundle (universal arm64 + x86_64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash build-app.sh

      - name: Verify universal binary
        run: |
          lipo -info "dist/DeepSeek Harness.app/Contents/MacOS/DSHWebView"
          # Fail fast if either architecture is missing.
          lipo -info "dist/DeepSeek Harness.app/Contents/MacOS/DSHWebView" \
            | grep -q "arm64" && echo "arm64 OK"
          lipo -info "dist/DeepSeek Harness.app/Contents/MacOS/DSHWebView" \
            | grep -q "x86_64" && echo "x86_64 OK"

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/create-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
